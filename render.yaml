services:
  - type: web
    name: gold-trading-system
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
